train:
  batch_size: 300
  num_workers: 8
  lambda_x_train: 1
  lambda_q_train: 1
  lambda_x_valid: 1
  lambda_q_valid: 1
  clip_grad: 100.0
  progress_bar: False

  noise_type: straight_to_x0
  loss_weight: cfm
  do_scale: false

  transform: projection_dq2dx
  transform_at_forward: true

  optimizer:
    type: adam
    lr: 5.e-4
    weight_decay: 0.
    beta1: 0.95
    beta2: 0.999
  scheduler:
    type: plateau
    factor: 0.8
    patience: 10
    min_lr: 0.000125

  seed: 42
  epochs: 3000

  check_val_every_n_epoch: 3
  sample_every_n_batch: 1
  sample_every_n_valid: 1

dataset:
  type: molecule
  name: qm7x
  # non-eq random
  datadir: data_qm7x
  raw_datadir: /home/jeheon/Projects/neural_opt/data/qm7x/qm7x_xyz
  # non-eq smallest
  # datadir: data_qm7x_smallest
  # raw_datadir: /home/jeheon/Projects/neural_opt/data/qm7x/qm7x_xyz_smallest
  # morered results
  # datadir: data_qm7x_morered
  # raw_datadir: /home/jeheon/Projects/neural_opt/data/qm7x/qm7x_xyz_morered

  # datadir: data_qm7x_subset
  # raw_datadir: /home/jeheon/Projects/neural_opt/data/qm7x/qm7x_xyz_subset
  # datadir: data_qm7x_median_subset
  # raw_datadir: /home/jeheon/Projects/neural_opt/data/qm7x/qm7x_xyz_median_subset
  # datadir: data_qm7x_morered_subset
  # raw_datadir: /home/jeheon/Projects/neural_opt/data/qm7x/qm7x_xyz_morered_subset
  # datadir: data_qm7x_smallest_subset
  # raw_datadir: /home/jeheon/Projects/neural_opt/data/qm7x/qm7x_xyz_smallest_subset
  # datadir: data_qm7x_morered_smallest_subset
  # raw_datadir: /home/jeheon/Projects/neural_opt/data/qm7x/qm7x_xyz_morered_smallest_subset

  data_split: /home/jeheon/Projects/neural_opt/data/qm7x/data_split.pkl
  dtype: float32  # deprecated

debug:
  save_dir: './debug'
  save_dynamic_final_only: True
  save_dynamic: ./save_dynamic.qm7x.rdsm.finetuned.pt

general:
  name: sampling.qm7x.rdsm
  use_wandb: False
  wandb: 'online'
  save_model: True
  gpus: 1
  # gpus: 0
  strategy: ddp  # 'deepspeed'  # auto, ddp, fsdp, deepspeed,
  resume:
  # test_only: /home/jeheon/Projects/neural_opt/checkpoints/rdsm.qm7x.finetuning.20250620.hidden_dim256.t1_1500.t150_30times/epoch3140_loss0.00060.ckpt
  test_only: ./reproducible/checkpoints/rdsm.qm7x.finetuned.ckpt
  evaluate_all_checkpoints:

sampling:
  score_type: cfm
  stochastic: False

  # sde_steps: 128
  sde_steps: 256
  num_cycles: 1

  sde_dt: 0.01  # deprecated
  gode_iter: 50
  gode_ref_dt: 0.05
  gode_max_dt: 0.1
  time_margin: 0.0

model:
  name: geodiff

  pred_type: edge  # edge or node
  # hidden_dim: 128
  hidden_dim: 256
  num_bond_type: 10
  # num_atom_type: 5
  num_atom_type: 7
  num_atom_feat: 8
  append_atom_feat: true

  edge_encoder: mlp
  mlp_act: swish
  score_act: swish

  graph_encoder:
    name: schnet
    edge_emb: False
    num_convs: 7
    cutoff: 10.0
    smooth_conv: False
    mlp_act: swish
    # hidden_dim: 128
    hidden_dim: 256

diffusion:
  # NOTE: No matter when sampling with CFM
  scheduler:
    t_start: 0.0
    t_end: 0.3
    name: continuous_tsdiff
    c: 12
    beta_start: 1.e-7
    beta_end: 10
    num_diffusion_timesteps: 5000  # reference: discrete equivalent

manifold:
  ode_solver:
    vpae_thresh: 0.03  # percent error threshold
    svd_tol: 1e-2
    alpha: 1.7
    beta: 0.01
    gamma: 0.0
    iter: 1
    max_iter: 1
    ref_dt: 5e-2
    _ref_dt: 1e-3
    max_dt: 1e-1
    _max_dt: 5e-2
    min_dt: 1e-3
    _min_dt: 1e-4
    pos_adjust_scaler: 0.0
    pos_adjust_thresh: 0.0
    q_type: morse
