train:
  batch_size: 1000
  num_workers: 8
  lambda_x_train: 1
  lambda_q_train: 1
  lambda_x_valid: 1
  lambda_q_valid: 1
  clip_grad: 100.0
  progress_bar: False

  noise_type: straight_to_x0
  loss_weight: cfm
  do_scale: false

  transform: projection_dq2dx
  transform_at_forward: true

  optimizer:
    type: adam
    lr: 5.e-4
    weight_decay: 0.
    beta1: 0.95
    beta2: 0.999
  scheduler:
    type: plateau
    factor: 0.8
    patience: 10
    min_lr: 0.000125

  seed: 42
  epochs: 3000

  check_val_every_n_epoch: 3
  sample_every_n_batch: 1
  sample_every_n_valid: 1

dataset:
  type: molecule
  name: MMFFtoDFT
  datadir: data/qm9m_MMFFtoDFT
  raw_datadir: ./data/qm9m_raw/MMFFtoDFT_input
  data_split: ./data/qm9m_raw/data_split.pkl
  dtype: float32

debug:
  save_dir: './debug'
  save_dynamic: './save_dynamic.qm9.rdsm.langevin.pt'
  save_dynamic_final_only: true

general:
  name: sampling.qm9.rdsm.langevin
  use_wandb: False
  wandb: 'online'
  save_model: True
  gpus: 1
  strategy: ddp
  resume:
  test_only: ./reproducible/checkpoints/rdsm.qm9.finetuned.ckpt
  evaluate_all_checkpoints:

sampling:
  score_type: langevin_exp
  graph_condition: True
  noisy_pos_idx: -1
  stochastic: False
  sde_steps: 128
  sde_dt: 0.01
  gode_iter: 50
  gode_ref_dt: 0.05
  gode_max_dt: 0.1
  time_margin: 0.0
  num_cycles: 1
  langevin_exp:
    nfe: 128
    use_exp_map: False
    save_vector_field: False
    start_time: 0.03

model:
  name: geodiff

  pred_type: edge
  hidden_dim: 128
  num_bond_type: 10
  num_atom_type: 5
  num_atom_feat: 8

  append_atom_feat: true
  edge_encoder: mlp
  mlp_act: swish
  score_act: swish

  graph_encoder:
    name: schnet
    edge_emb: False
    num_convs: 7
    cutoff: 10.0
    smooth_conv: False
    mlp_act: swish
    hidden_dim: 128

diffusion:
  scheduler:
    t_start: 0.0
    t_end: 0.03
    name: continuous_tsdiff
    c: 12
    beta_start: 1.e-7
    beta_end: 10
    num_diffusion_timesteps: 5000  # reference: discrete equivalent
    EPS: 1.e-7

manifold:
  ode_solver:
    vpae_thresh: 0.03
    svd_tol: 1e-2
    alpha: 1.7
    beta: 0.01
    gamma: 0.0
    iter: 3
    max_iter: 3
    ref_dt: 5e-2
    _ref_dt: 1e-3
    max_dt: 1e-1
    _max_dt: 5e-2
    min_dt: 1e-3
    _min_dt: 1e-4
    pos_adjust_scaler: 0.0
    pos_adjust_thresh: 0.0
    q_type: morse
